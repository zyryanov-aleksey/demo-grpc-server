syntax = "proto3";

package demo;

option java_multiple_files = true;
option java_package = "com.zyryanov.demo_grpc_server.proto";
option java_outer_classname = "DemoProto";

import "google/protobuf/timestamp.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/any.proto";
import "google/protobuf/api.proto";
import "google/protobuf/field_mask.proto";
import "google/protobuf/source_context.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/type.proto";
import "google/protobuf/wrappers.proto";
import "buf/validate/validate.proto";

service DemoService {
  rpc binaryStream(stream AllTypesRequest) returns (stream AllTypesResponse);
  rpc serverStream(AllTypesRequest) returns (stream AllTypesResponse);
  rpc partialFailure(AllTypesRequest) returns (stream AllTypesResponse);
  rpc clientStream(stream AllTypesRequest) returns (AllTypesResponse);
  rpc nonStream(AllTypesRequest) returns (AllTypesResponse);
  rpc echo(EchoRequest) returns (EchoResponse);
  rpc wellKnownTypes(WellKnownTypes) returns (WellKnownTypes);
  rpc alwaysFails(google.protobuf.Empty) returns (google.protobuf.Empty);
}

// Echo payload covering the complete official google.protobuf well-known type index.
message WellKnownTypes {
  google.protobuf.DoubleValue double_value = 1;
  google.protobuf.FloatValue float_value = 2;
  google.protobuf.Int32Value int32_value = 3;
  google.protobuf.Int64Value int64_value = 4;
  google.protobuf.UInt32Value uint32_value = 5;
  google.protobuf.UInt64Value uint64_value = 6;
  google.protobuf.BoolValue bool_value = 7;
  google.protobuf.StringValue string_value = 8;
  google.protobuf.BytesValue bytes_value = 9;
  google.protobuf.Timestamp timestamp = 10;
  google.protobuf.Duration duration = 11;
  google.protobuf.FieldMask field_mask = 12;
  google.protobuf.Syntax syntax = 13;
  google.protobuf.Field.Kind kind = 14;
  google.protobuf.Field.Cardinality cardinality = 15;
  optional google.protobuf.NullValue null_value = 16;

  google.protobuf.Struct struct_value = 17;
  google.protobuf.Value dynamic_value = 18;
  google.protobuf.ListValue list_value = 19;
  google.protobuf.Empty empty_value = 20;
  google.protobuf.Any any_value = 21;

  google.protobuf.Api api = 22;
  google.protobuf.Method method = 23;
  google.protobuf.Mixin mixin = 24;
  google.protobuf.Type type_model = 25;
  google.protobuf.Field field_model = 26;
  google.protobuf.Enum enum_model = 27;
  google.protobuf.EnumValue enum_value = 28;
  google.protobuf.Option option = 29;
  google.protobuf.SourceContext source_context = 30;
  optional google.protobuf.Syntax optional_syntax = 31;
}

// Payload of the rich error returned by alwaysFails.
message DemoErrorDetail {
  string reason = 1 [
    (buf.validate.field).string = {min_len: 1, max_len: 200},
    (buf.validate.field).string.example = "invalid input"
  ];
  string field = 2 [
    (buf.validate.field).string.max_len = 100,
    (buf.validate.field).string.example = "message"
  ];
  string request_id = 3 [
    (buf.validate.field).string = {min_len: 1, max_len: 64},
    (buf.validate.field).string.example = "req-42"
  ];
}

/*
глобальный коммент
 */
message EchoRequest {
  // Текст сообщения, которое необходимо обработать или вернуть в ответ.
  string message = 1  [
    (buf.validate.field).required = true,
    (buf.validate.field).string = {min_len: 1, max_len: 500},
    (buf.validate.field).string.example = "hello"
  ];

  /*
  Комментарий 2
   */
  int32 repeat = 2;

  /*
  * Комментарий 2
  */
  repeated string labels = 3 [
    (buf.validate.field).repeated = {max_items: 10},
    (buf.validate.field).repeated.items.string.max_len = 32,
    (buf.validate.field).repeated.items.string.example = "greeting"
  ];

  /**
  * Комментарий 3
  */
  map<string, string> attributes = 4 [(buf.validate.field).map = {
    max_pairs: 20,
    keys: {string: {example: "source"}},
    values: {string: {example: "demo"}}
  }];

  // Только одно из полей selector может быть заполнено.
  oneof selector {
    // Текстовый селектор.
    string text = 5[
      (buf.validate.field).string.example = "hello"
    ];

    // Числовой селектор.
    int64 number = 6[
      (buf.validate.field).int64.example = 123
    ];
  }

  // Время, связанное с запросом (например, время создания).
  google.protobuf.Timestamp at = 7 [(buf.validate.field).required = true];

  google.protobuf.Duration duration = 8 [(buf.validate.field).required = true];
}

message EchoResponse {
  string message = 1 [
    (buf.validate.field).string.max_len = 500,
    (buf.validate.field).string.example = "hello"
  ];
  int32 index = 2 [
    (buf.validate.field).int32.gte = 0,
    (buf.validate.field).int32.example = 1
  ];
  repeated string labels = 3 [
    (buf.validate.field).repeated.max_items = 10,
    (buf.validate.field).repeated.items.string.example = "greeting"
  ];
  map<string, string> attributes = 4 [(buf.validate.field).map = {
    max_pairs: 20,
    keys: {string: {example: "source"}},
    values: {string: {example: "demo"}}
  }];
  google.protobuf.Timestamp received_at = 5 [(buf.validate.field).required = true];
  google.protobuf.Duration duration = 6 [(buf.validate.field).required = true];
}

enum ExampleState {
  EXAMPLE_STATE_UNSPECIFIED = 0;
  EXAMPLE_STATE_ENABLED = 1;
  EXAMPLE_STATE_DISABLED = 2;
}

message AllTypesRequest {
  double doubleValue = 1 [(buf.validate.field).double = {finite: true, example: 12.5}];
  float floatValue = 2 [(buf.validate.field).float = {finite: true, example: 3.25}];
  int32 int32Value = 3 [(buf.validate.field).int32 = {gte: -1000, lte: 1000, example: 42}];
  int64 int64Value = 4 [(buf.validate.field).int64 = {gte: -1000000, lte: 1000000, example: 900}];
  uint32 uint32Value = 5 [(buf.validate.field).uint32 = {lte: 1000000, example: 7}];
  uint64 uint64Value = 6 [(buf.validate.field).uint64 = {lte: 1000000, example: 8}];
  sint32 sint32Value = 7 [(buf.validate.field).sint32.example = -2];
  sint64 sint64Value = 8 [(buf.validate.field).sint64.example = -3];
  fixed32 fixed32Value = 9 [(buf.validate.field).fixed32.example = 4];
  fixed64 fixed64Value = 10 [(buf.validate.field).fixed64.example = 5];
  sfixed32 sfixed32Value = 11 [(buf.validate.field).sfixed32.example = -6];
  sfixed64 sfixed64Value = 12 [(buf.validate.field).sfixed64.example = -7];
  bool boolValue = 13 [(buf.validate.field).bool.example = true];
  string stringValue = 14 [(buf.validate.field).string = {max_len: 200, example: "sample"}];
  bytes bytesValue = 15 [(buf.validate.field).bytes = {max_len: 1048576, example: "AQI="}];

  optional string optionalValue = 16 [(buf.validate.field).string = {max_len: 200, example: "optional"}];
  repeated string repeatedValues = 17 [(buf.validate.field).repeated = {max_items: 20, items: {string: {example: "one"}}}];
  map<string, int32> mapValues = 18 [(buf.validate.field).map = {
    max_pairs: 20,
    keys: {string: {example: "answer"}},
    values: {int32: {example: 42}}
  }];
  ExampleState enumValue = 19 [(buf.validate.field).enum = {defined_only: true, example: 1}];
  AllTypesResponse messageValue = 20 [(buf.validate.field).required = true];

  oneof selectedValue {
    string selectedStringValue = 21 [(buf.validate.field).string.example = "selected"];
    int32 selectedInt32Value = 22 [(buf.validate.field).int32.example = 10];
  }

  repeated AllTypesResponse repeatedMessageValues = 23 [(buf.validate.field).repeated.max_items = 10];
}

message AllTypesResponse {
  double doubleValue = 1 [(buf.validate.field).double = {finite: true, example: 12.5}];
  float floatValue = 2 [(buf.validate.field).float = {finite: true, example: 3.25}];
  int32 int32Value = 3 [(buf.validate.field).int32 = {gte: -1000, lte: 1000, example: 42}];
  int64 int64Value = 4 [(buf.validate.field).int64 = {gte: -1000000, lte: 1000000, example: 900}];
  uint32 uint32Value = 5 [(buf.validate.field).uint32 = {lte: 1000000, example: 7}];
  uint64 uint64Value = 6 [(buf.validate.field).uint64 = {lte: 1000000, example: 8}];
  sint32 sint32Value = 7 [(buf.validate.field).sint32.example = -2];
  sint64 sint64Value = 8 [(buf.validate.field).sint64.example = -3];
  fixed32 fixed32Value = 9 [(buf.validate.field).fixed32.example = 4];
  fixed64 fixed64Value = 10 [(buf.validate.field).fixed64.example = 5];
  sfixed32 sfixed32Value = 11 [(buf.validate.field).sfixed32.example = -6];
  sfixed64 sfixed64Value = 12 [(buf.validate.field).sfixed64.example = -7];
  bool boolValue = 13 [(buf.validate.field).bool.example = true];
  string stringValue = 14 [(buf.validate.field).string = {max_len: 200, example: "sample"}];
  bytes bytesValue = 15 [(buf.validate.field).bytes = {max_len: 1048576, example: "AQI="}];

  optional string optionalValue = 16 [(buf.validate.field).string = {max_len: 200, example: "optional"}];
  repeated string repeatedValues = 17 [(buf.validate.field).repeated = {max_items: 20, items: {string: {example: "one"}}}];
  map<string, int32> mapValues = 18 [(buf.validate.field).map = {
    max_pairs: 20,
    keys: {string: {example: "answer"}},
    values: {int32: {example: 42}}
  }];
  ExampleState enumValue = 19 [(buf.validate.field).enum = {defined_only: true, example: 1}];
  AllTypesRequest messageValue = 20 [(buf.validate.field).required = true];

  oneof selectedValue {
    string selectedStringValue = 21 [(buf.validate.field).string.example = "selected"];
    int32 selectedInt32Value = 22 [(buf.validate.field).int32.example = 10];
  }

  repeated AllTypesRequest repeatedMessageValues = 23 [(buf.validate.field).repeated.max_items = 10];
}
